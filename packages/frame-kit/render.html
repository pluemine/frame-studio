<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Frame Plex Thai";
      src: url("assets/IBMPlexSansThai-Regular.ttf");
      font-weight: 400;
    }
    @font-face {
      font-family: "Frame Plex Thai Looped";
      src: url("assets/IBMPlexSansThaiLooped-Regular.ttf");
      font-weight: 400;
    }</style
  ><canvas id="output"></canvas>
  <script type="module">
    import {
      loadFonts,
      loadImage,
      loadSocialIcons,
      renderFrame,
    } from "./renderer.mjs";
    window.generateFrame = async ({ image, logo, options }) => {
      await loadFonts();
      const [source, mark, icons] = await Promise.all([
        loadImage(image),
        logo ? loadImage(logo) : null,
        loadSocialIcons(options.social),
      ]);
      const canvas = document.getElementById("output");
      const size = renderFrame(canvas, source, mark, options, 1, icons);
      return { ...size, png: canvas.toDataURL("image/png") };
    };
  </script>
</html>
